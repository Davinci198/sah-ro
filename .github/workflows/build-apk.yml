name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Full history so `git describe --tags` can see the release tags.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Resolve version from latest tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version_name="${major}.${minor}.${patch}"
          else
            printf 'No release tag found (git describe: %s); falling back to 1.0\n' "$tag"
            major=1
            minor=0
            patch=0
            version_name="1.0"
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch + 1))
          {
            printf 'SAH_VERSION_NAME=%s\n' "$version_name"
            printf 'SAH_VERSION_CODE=%s\n' "$version_code"
          } >> "$GITHUB_ENV"
          printf 'Resolved versionName=%s versionCode=%s (tag: %s)\n' "$version_name" "$version_code" "$tag"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sah_ro-release.jks"
          test -s "$RUNNER_TEMP/sah_ro-release.jks"

      - name: Run unit tests and build signed APK
        env:
          SAH_RELEASE_STORE_FILE: ${{ runner.temp }}/sah_ro-release.jks
          SAH_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAH_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAH_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SAH_RELEASE_STORE_PASSWORD"
          test -n "$SAH_RELEASE_KEY_ALIAS"
          test -n "$SAH_RELEASE_KEY_PASSWORD"
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sah_ro-release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: sah-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
