name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed sah_ro release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sah_ro-release.jks"
          test -s "$RUNNER_TEMP/sah_ro-release.jks"

      - name: Run tests and build signed release APK
        env:
          SAH_RELEASE_STORE_FILE: ${{ runner.temp }}/sah_ro-release.jks
          SAH_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAH_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAH_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$SAH_RELEASE_STORE_PASSWORD"
          test -n "$SAH_RELEASE_KEY_ALIAS"
          test -n "$SAH_RELEASE_KEY_PASSWORD"
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/sah_ro.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose dist/sah_ro.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sah_ro-release-${{ github.sha }}
          path: dist/sah_ro.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/sah_ro.apk --title "sah_ro $GITHUB_REF_NAME" --generate-notes
